name: Altron bug report (English)
description: Report a reproducible problem without secrets or personal data
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach .env, auth.json, the database, an entire profile, conversations, or raw logs.
        Altron provides a safe diagnostics panel: its report contains only versions and counts.
        Review and sanitize any additional text and screenshots before publishing them.
        For Russian, use the [separate Russian form](https://github.com/VibeSan7/altron-desktop/issues/new?template=bug_report.ru.yml).
  - type: input
    id: version
    attributes:
      label: Altron, Hermes, and Windows versions
      placeholder: For example, Altron 0.4.0-beta.1 / Hermes 0.21.3 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe actions using a synthetic example, without a personal task or paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What did you expect, what happened, and which status is shown? Was the run repeated?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe Altron report (optional)
      description: Only the report from the diagnostics panel, not configuration files or an entire log.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Check before publishing
      options:
        - label: I checked the text and attachments; they contain no secrets, personal paths, or conversations.
          required: true
