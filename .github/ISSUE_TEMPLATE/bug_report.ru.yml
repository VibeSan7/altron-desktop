name: Ошибка Altron (Русский)
description: Сообщить о воспроизводимой проблеме без секретов и личных данных
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте .env, auth.json, базу, полный профиль, переписки или необработанные журналы.
        В Altron есть «Помощь и безопасная диагностика»: отчёт содержит только версии и счётчики.
        Просмотрите и очистите любые дополнительные тексты и снимки экрана перед публикацией.
        Для английского языка используйте [отдельную английскую форму](https://github.com/VibeSan7/altron-desktop/issues/new?template=bug_report.yml).
  - type: input
    id: version
    attributes:
      label: Версии Altron, Hermes и Windows
      placeholder: Например, Altron 0.4.0-beta.1 / Hermes 0.21.3 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Опишите действия на искусственном примере, без личной задачи и путей.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый и фактический результат
      description: Что ожидалось, что произошло, какой статус показывается? Повторялся ли запуск?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Безопасный отчёт Altron (необязательно)
      description: Только отчёт из панели диагностики, не файлы конфигурации или журнал целиком.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка перед публикацией
      options:
        - label: Я проверил текст и приложения — в них нет секретов, личных путей и переписок.
          required: true
